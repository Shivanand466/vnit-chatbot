<!DOCTYPE html>
<!-- Used by tools/shot.sh: headless Edge can't make a window narrower than about 500 px,
     so phone-sized screenshots load the page in a frame of the phone's width. -->
<html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}iframe{border:0;display:block}</style></head>
<body><iframe id="f"></iframe>
<script>
var q = new URLSearchParams(location.search);
var f = document.getElementById("f");
f.width = q.get("w"); f.height = q.get("h"); f.src = q.get("src");
</script></body></html>
