<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VNIT Chatbot</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --panel: #ffffff;
    --ink: #16181d;
    --ink-soft: #5b6472;
    --ink-faint: #8a93a0;
    --line: #e3e6ea;
    --accent: #1d4ed8;
    --accent-soft: #eef2ff;
    --user: #1d4ed8;
    --note: #fff8e6;
    --note-line: #e8c96a;
    --ok: #15803d;
    --warn: #b45309;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --ink: #e9ecf1; --ink-soft: #a7b0bd;
      --ink-faint: #76808f; --line: #262b35; --accent: #7aa2ff; --accent-soft: #1b2436;
      --user: #2b4a9e; --note: #2a2415; --note-line: #7a6424; --ok: #4ade80; --warn: #fbbf24;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 0 16px;
  }
  .app {
    width: 100%;
    max-width: 780px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 20px 0 16px;
  }

  header { flex: none; margin-bottom: 14px; }
  h1 {
    font-size: 1.2rem; font-weight: 650; margin: 0 0 4px;
    letter-spacing: -.01em; display: flex; align-items: center; gap: 9px;
  }
  h1 .dot {
    width: 9px; height: 9px; border-radius: 50%; background: #22c55e; flex: none;
  }
  header p { margin: 0; color: var(--ink-soft); font-size: .88rem; }

  /* Starter questions */
  .starters { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .starters button {
    font: inherit; font-size: .8rem; color: var(--accent);
    background: var(--accent-soft); border: 1px solid transparent;
    padding: 6px 11px; border-radius: 999px; cursor: pointer;
  }
  .starters button:hover { border-color: var(--accent); }

  /* Conversation */
  #chat {
    flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column;
    gap: 14px; padding: 4px 2px 10px;
  }
  .turn { display: flex; flex-direction: column; max-width: 92%; }
  .turn.me { align-self: flex-end; align-items: flex-end; }
  .turn.bot { align-self: flex-start; }

  .bubble {
    padding: 11px 15px; border-radius: var(--radius); font-size: .95rem;
  }
  .me .bubble {
    background: var(--user); color: #fff; border-bottom-right-radius: 5px;
  }
  .bot .bubble {
    background: var(--panel); border: 1px solid var(--line);
    border-bottom-left-radius: 5px; box-shadow: var(--shadow);
  }

  /* Answer body */
  .bubble > :first-child { margin-top: 0; }
  .bubble > :last-child { margin-bottom: 0; }
  .bubble p { margin: 0 0 .6em; }
  .bubble strong { font-weight: 650; }
  .bubble ul, .bubble ol { margin: .45em 0 .6em; padding-left: 1.3em; }
  .bubble li { margin: .22em 0; }
  .bubble li::marker { color: var(--ink-faint); }
  .bubble code {
    font: .85em ui-monospace, "Cascadia Code", Consolas, monospace;
    background: var(--accent-soft); padding: .1em .35em; border-radius: 4px;
  }
  .bubble .note {
    background: var(--note); border-left: 3px solid var(--note-line);
    padding: 8px 12px; border-radius: 0 8px 8px 0; margin: .6em 0;
    font-size: .9rem;
  }
  .bubble table { border-collapse: collapse; width: 100%; margin: .5em 0; font-size: .88rem; }
  .bubble th, .bubble td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  .bubble th { background: var(--accent-soft); font-weight: 600; }

  .understood {
    font-size: .8rem; color: var(--ink-soft); margin-bottom: 6px;
    padding-left: 2px; display: flex; gap: 6px; align-items: baseline;
  }
  .understood span:first-child { color: var(--ink-faint); flex: none; }

  /* Sources */
  .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .sources a {
    font-size: .78rem; color: var(--ink-soft); text-decoration: none;
    border: 1px solid var(--line); background: var(--bg);
    padding: 3px 9px; border-radius: 999px;
    max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sources a:hover { border-color: var(--accent); color: var(--accent); }
  .sources a b { color: var(--accent); font-weight: 650; margin-right: 4px; }
  .bubble sup { color: var(--accent); font-size: .7em; font-weight: 650; margin-left: 1px; }

  /* Verification badge and the agent's steps */
  .check { border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); }
  .check.ok { color: var(--ok); border-color: var(--ok); }
  .check.warn { color: var(--warn); border-color: var(--warn); }
  details.steps { margin-top: 8px; font-size: .8rem; color: var(--ink-soft); }
  details.steps summary { cursor: pointer; color: var(--ink-faint); width: fit-content; }
  details.steps summary:hover { color: var(--accent); }
  details.steps ol {
    margin: 6px 0 0; padding: 8px 12px 8px 30px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px;
  }
  details.steps li { margin: 3px 0; }
  details.steps li .kind {
    font-size: .7rem; text-transform: uppercase; letter-spacing: .04em;
    color: var(--accent); margin-right: 6px; font-weight: 650;
  }
  .typing-label { font-size: .78rem; color: var(--ink-faint); margin-left: 8px; }

  /* Footer row of a bot turn */
  .meta {
    display: flex; align-items: center; gap: 10px; margin-top: 8px;
    font-size: .74rem; color: var(--ink-faint); flex-wrap: wrap;
  }
  .meta .rate { display: flex; gap: 5px; margin-left: auto; }
  .meta .rate button {
    font: inherit; font-size: .9rem; line-height: 1; cursor: pointer;
    background: none; border: 1px solid var(--line); color: inherit;
    border-radius: 7px; padding: 3px 7px;
  }
  .meta .rate button:hover:not(:disabled) { border-color: var(--accent); }
  .meta .rate button:disabled { opacity: .45; cursor: default; }

  /* Typing indicator */
  .typing { display: inline-flex; gap: 4px; padding: 3px 0; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint);
    animation: bounce 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  /* Composer */
  form {
    flex: none; display: flex; gap: 8px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px; box-shadow: var(--shadow);
  }
  textarea {
    flex: 1; font: inherit; font-size: .95rem; resize: none; border: none;
    background: none; color: var(--ink); padding: 7px 8px; max-height: 140px;
  }
  textarea:focus { outline: none; }
  button.send {
    font: inherit; font-weight: 550; font-size: .9rem; cursor: pointer;
    background: var(--accent); color: #fff; border: none;
    border-radius: 10px; padding: 9px 16px; flex: none;
  }
  button.send:disabled { opacity: .5; cursor: default; }
  .hint { flex: none; font-size: .72rem; color: var(--ink-faint); margin: 7px 2px 0; }
  .hint a { color: var(--ink-faint); }

  #api-row { flex: none; font-size: .72rem; color: var(--ink-faint); margin-top: 5px; }
  #api-row input {
    font: inherit; color: inherit; background: none;
    border: none; border-bottom: 1px dotted var(--line); width: 230px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span class="dot"></span> VNIT Nagpur Chatbot</h1>
    <p>Answers come only from VNIT's own website and documents, with the source shown for every answer and every figure checked against it.</p>
    <div class="starters" id="starters"></div>
  </header>

  <div id="chat" aria-live="polite"></div>

  <form id="form">
    <textarea id="question" rows="1" placeholder="Ask about fees, hostels, admissions, exams, scholarships…" autocomplete="off"></textarea>
    <button class="send" type="submit" id="send">Ask</button>
  </form>
  <p class="hint">Enter to send · Shift+Enter for a new line · follow-ups like “and for girls?” work</p>
  <div id="api-row">server: <input id="api-url" value="http://localhost:8000/ask" spellcheck="false"></div>
</div>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('question');
const sendBtn = document.getElementById('send');
const apiUrlInput = document.getElementById('api-url');
const asked = [];   // questions so far, so a follow-up can be understood

if (location.protocol.startsWith('http')) apiUrlInput.value = location.origin + '/ask';

const STARTERS = [
  'Who is the Director of VNIT?',
  'What is the hostel fee for first year B.Tech boys for Winter 2026?',
  'What tuition fee do SC/ST B.Tech students pay?',
  'When are the end semester exams in Winter 2026?',
];

const starters = document.getElementById('starters');
STARTERS.forEach(q => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = q;
  b.addEventListener('click', () => { input.value = q; ask(); });
  starters.appendChild(b);
});

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c =>
    ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

// Minimal Markdown -> HTML for what the model actually writes: bold, italics,
// inline code, bullet and numbered lists, and "Note:" lines. Everything is
// escaped first, so nothing in an answer can inject HTML into the page.
function renderAnswer(text) {
  const lines = escapeHtml(text.replace(/\r/g, '')).split('\n');
  let html = '', list = null;

  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*(?!\s)([^*]+?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>')
    .replace(/`([^`]+?)`/g, '<code>$1</code>')
    .replace(/\[(\d+)\]/g, '<sup>$1</sup>');

  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };

  for (let raw of lines) {
    const line = raw.trim();
    if (!line) { closeList(); continue; }

    const bullet = line.match(/^[-*•]\s+(.*)$/);
    const numbered = line.match(/^(\d+)[.)]\s+(.*)$/);
    const note = line.match(/^(?:\*\*)?(note|caution|important)\s*:?(?:\*\*)?\s*:?\s*(.*)$/i);

    if (bullet) {
      if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; }
      html += `<li>${inline(bullet[1])}</li>`;
    } else if (numbered) {
      if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; }
      html += `<li>${inline(numbered[2])}</li>`;
    } else if (note && note[2]) {
      closeList();
      html += `<div class="note"><strong>${note[1][0].toUpperCase()}${note[1].slice(1)}:</strong> ${inline(note[2])}</div>`;
    } else {
      closeList();
      html += `<p>${inline(line.replace(/^#+\s*/, ''))}</p>`;
    }
  }
  closeList();
  return html;
}

function addTurn(cls) {
  const turn = document.createElement('div');
  turn.className = 'turn ' + cls;
  chat.appendChild(turn);
  chat.scrollTop = chat.scrollHeight;
  return turn;
}

function addMine(text) {
  const turn = addTurn('me');
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  turn.appendChild(b);
}

function addThinking() {
  const turn = addTurn('bot');
  turn.innerHTML = '<div class="bubble"><span class="typing"><i></i><i></i><i></i></span>'
    + '<span class="typing-label">Searching VNIT’s documents…</span></div>';
  // A question that needs extra lookups can wait for the free plan's
  // per-minute allowance, so say so rather than look frozen.
  const label = turn.querySelector('.typing-label');
  const later = setTimeout(() => {
    label.textContent = 'Looking further — extra lookups can take up to a minute on the free plan…';
  }, 12000);
  turn.stopTimer = () => clearTimeout(later);
  return turn;
}

async function rate(data, rating, row, status) {
  row.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    const resp = await fetch(apiUrlInput.value.replace(/\/ask$/, '/feedback'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question: data.understood_as || data.question,
        answer: data.answer, mode: data.mode, rating,
      }),
    });
    status.textContent = resp.ok ? 'Thanks!' : 'Could not save that.';
  } catch (_) {
    status.textContent = 'Could not save that.';
  }
}

function fillAnswer(turn, data) {
  if (turn.stopTimer) turn.stopTimer();
  turn.innerHTML = '';

  if (data.understood_as) {
    const note = document.createElement('div');
    note.className = 'understood';
    const label = document.createElement('span');
    label.textContent = 'Understood as';
    const q = document.createElement('span');
    q.textContent = data.understood_as;
    note.append(label, q);
    turn.appendChild(note);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = renderAnswer(data.answer);

  if (data.sources && data.sources.length) {
    const src = document.createElement('div');
    src.className = 'sources';
    // Numbered like the [1], [2] citations in the answer, when it has any.
    const numbered = /\[\d+\]/.test(data.answer || '');
    data.sources.forEach((s, i) => {
      const a = document.createElement('a');
      a.href = /^https?:\/\//.test(s.url) ? s.url : '#';
      a.target = '_blank';
      a.rel = 'noopener';
      if (numbered) {
        const n = document.createElement('b');
        n.textContent = i + 1;
        a.appendChild(n);
      }
      a.appendChild(document.createTextNode(s.date ? `${s.title} (${s.date})` : s.title));
      a.title = s.url;
      src.appendChild(a);
    });
    bubble.appendChild(src);
  }
  turn.appendChild(bubble);

  // The agent's steps: what it searched, which documents it opened, what it
  // calculated, and what the verifier found -- so it can be checked, not trusted.
  if (data.trace && data.trace.length) {
    const details = document.createElement('details');
    details.className = 'steps';
    const summary = document.createElement('summary');
    const tools = data.trace.filter(t => t.step === 'tool').length;
    summary.textContent = `How I found this (${data.trace.length} steps`
      + (tools ? `, ${tools} extra lookup${tools > 1 ? 's' : ''}` : '') + ')';
    details.appendChild(summary);
    const list = document.createElement('ol');
    const KIND = { understand: 'understood', route: 'decided', search: 'searched',
                   tool: 'acted', answer: 'answered', verify: 'checked', revise: 'revised',
                   fallback: 'fallback' };
    data.trace.forEach(t => {
      const li = document.createElement('li');
      const kind = document.createElement('span');
      kind.className = 'kind';
      kind.textContent = KIND[t.step] || t.step;
      li.append(kind, document.createTextNode(t.text));
      list.appendChild(li);
    });
    details.appendChild(list);
    turn.appendChild(details);
  }

  const meta = document.createElement('div');
  meta.className = 'meta';
  const mode = document.createElement('span');
  mode.textContent = data.mode;
  meta.appendChild(mode);

  const v = data.verification;
  if (v && (v.verdict === 'verified' || v.verdict === 'unsupported')) {
    const badge = document.createElement('span');
    const ok = v.verdict === 'verified';
    badge.className = 'check ' + (ok ? 'ok' : 'warn');
    badge.textContent = ok ? `✓ ${v.checked} figure${v.checked === 1 ? '' : 's'} checked against sources`
                           : `⚠ not confirmed: ${v.unsupported.join(', ')}`;
    meta.appendChild(badge);
  }

  // Rating only makes sense for a real answer, not a greeting.
  if (!String(data.mode).startsWith('direct')) {
    const row = document.createElement('span');
    row.className = 'rate';
    const status = document.createElement('span');
    [['\u{1F44D}', 'up'], ['\u{1F44E}', 'down']].forEach(([label, value]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.title = value === 'up' ? 'Helpful' : 'Not helpful';
      b.addEventListener('click', () => rate(data, value, row, status));
      row.appendChild(b);
    });
    row.appendChild(status);
    meta.appendChild(row);
  }
  turn.appendChild(meta);
  chat.scrollTop = chat.scrollHeight;
}

async function ask() {
  const question = input.value.trim();
  if (!question || sendBtn.disabled) return;
  addMine(question);
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  const pending = addThinking();

  try {
    const resp = await fetch(apiUrlInput.value, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, history: asked.slice(-3) }),
    });
    if (!resp.ok) {
      let detail = 'HTTP ' + resp.status;
      try { detail = (await resp.json()).detail || detail; } catch (_) {}
      pending.innerHTML = '';
      fillAnswer(pending, { question, answer: detail, sources: [], mode: 'error' });
      return;
    }
    const data = await resp.json();
    fillAnswer(pending, data);
    asked.push(data.understood_as || question);
  } catch (err) {
    fillAnswer(pending, {
      question,
      answer: 'Could not reach the chatbot server (' + err.message + '). Is it still running?',
      sources: [], mode: 'error',
    });
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', e => { e.preventDefault(); ask(); });

// Enter sends, Shift+Enter makes a new line; the box grows with the text.
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});
input.focus();
</script>
</body>
</html>
